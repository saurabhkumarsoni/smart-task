<app-auth-layout eyebrow="TaskPilot" title="Account recovery"
  subtitle="Recover account access in a secure and guided flow.">
  <div class="auth-copy">
    <div class="auth-heading">
      <span class="section-kicker">Forgot password</span>
      <h2>Request reset link</h2>
      <p>Enter your account email and we will generate a secure password reset link.</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>Email address</label>
      <input type="email" formControlName="email" placeholder="hello@taskpilot.app" />

      @if (submittedMessage) {
      <p class="auth-success">{{ submittedMessage }}</p>

      @if (resetToken) {
      <p class="auth-dev-link">
        Local testing link:
        <a [routerLink]="['/reset-password']" [queryParams]="{ token: resetToken }">Open reset password page</a>
      </p>
      }
      }

      <p class="auth-footnote">
        Remembered your password? <a routerLink="/login">Back to sign in</a>
      </p>

      <button type="submit" class="primary-action">Send reset link</button>
    </form>
  </div>
</app-auth-layout>
