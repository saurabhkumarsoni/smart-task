<div class="password-field">
  <label>{{ label }}</label>
  <div class="input-wrap">
    <input [type]="visible ? 'text' : 'password'" [value]="value" [disabled]="disabled" [placeholder]="placeholder" [autocomplete]="autocomplete" [attr.aria-describedby]="describedBy || null" (input)="input($any($event.target).value)" (blur)="blur()" />
    <button type="button" class="toggle" [disabled]="disabled" (click)="toggle()" [attr.aria-label]="visible ? 'Hide password' : 'Show password'">{{ visible ? 'Hide' : 'Show' }}</button>
  </div>
</div>
