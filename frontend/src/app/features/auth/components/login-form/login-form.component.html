<form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (errorMessage) {
    <div class="error-banner" role="alert">
      <span aria-hidden="true">!</span>
      <div>{{ errorMessage }}</div>
    </div>
  }

  <div class="field">
    <label for="login-email">Email address</label>
    <input id="login-email" type="email" formControlName="email" autocomplete="email" placeholder="you@company.com" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Enter a valid email address.</small>
    }
  </div>

  <div class="field">
    <div class="label-row">
      <label for="login-password">Password</label>
      <a routerLink="/forgot-password">Forgot password?</a>
    </div>
    <div class="password-input">
      <input id="login-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Enter your password" />
      <button type="button" class="visibility" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
        {{ showPassword ? 'Hide' : 'Show' }}
      </button>
    </div>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Password is required.</small>
    }
  </div>

  <button class="submit-button" type="submit" [disabled]="loading.value">
    @if (loading.value) { <span class="spinner" aria-hidden="true"></span> Signing in… } @else { Sign in to TaskPilot }
  </button>

  <p class="signup-copy">Don't have an account? <a routerLink="/register">Create an account</a></p>
</form>
