@if (password) {
  <div class="strength" aria-live="polite">
    <div class="strength-head"><span>Password strength</span><strong>{{ label }}</strong></div>
    <div class="bars" aria-hidden="true">
      @for (bar of [1,2,3,4,5]; track bar) { <span [class.filled]="bar <= score"></span> }
    </div>
    <small>Use 8+ characters with uppercase, lowercase, a number and a symbol.</small>
  </div>
}
