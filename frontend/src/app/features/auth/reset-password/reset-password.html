<app-auth-layout eyebrow="TaskPilot" title="Set a new password"
  subtitle="Use a strong password to keep your account secure.">
  <div class="auth-copy">
    <div class="auth-heading">
      <span class="section-kicker">Security</span>
      <h2>Choose a new password</h2>
      <p>Set your new password using the secure link sent to your email.</p>
    </div>

    @if (!token) {
    <p class="auth-error">
      Reset token is missing or invalid. Please request a new reset link from
      <a routerLink="/forgot-password">Forgot password</a>.
    </p>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" [class.disabled]="!token">

      <label>New password</label>
      <input type="password" formControlName="new_password" placeholder="Minimum 8 characters" />

      <p class="auth-footnote">Need another reset link? <a routerLink="/forgot-password">Request again</a></p>

      <button type="submit" class="primary-action" [disabled]="!token">Reset password</button>
    </form>
  </div>
</app-auth-layout>
